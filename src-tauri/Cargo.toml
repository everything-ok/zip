[package]
name = "extractr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Extractr - lightweight cross-platform archive extractor"

[lib]
name = "extractr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "extractr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
archive-core = { workspace = true, features = ["rar"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync"] }
anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
url = "2"
# Finder 右键 Service（NSServices）：objc2 已被 tao/tauri 间接拉入，
# 这里显式声明以在 src-tauri 直接使用 define_class! + AppKit API。
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSString", "NSArray", "NSError", "NSDictionary", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication"] }
block2 = "0.6.2"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
