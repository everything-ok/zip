name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.5)"
        required: true

permissions:
  contents: write

jobs:
  # =============================================
  # 触发版本号（tag 或手动输入）
  # =============================================
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT

  # =============================================
  # macOS (Apple Silicon)
  # =============================================
  build-macos-aarch64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Apple Silicon)
        run: npm run tauri -- build --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug bundle output
        run: |
          echo "=== Checking bundle directory ===" && find src-tauri/target -name "*.dmg" 2>/dev/null || echo "No DMG found in src-tauri/target" && echo "=== All bundle dirs ===" && find src-tauri/target -type d -name "bundle" 2>/dev/null || echo "No bundle dirs found" && echo "=== Target tree (first 30 lines) ===" && find src-tauri/target -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) 2>/dev/null | head -30 || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 3

  # =============================================
  # macOS (Intel)
  # =============================================
  build-macos-x86_64:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable + x86_64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Intel)
        run: npm run tauri -- build --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug bundle output
        run: |
          echo "=== Checking bundle directory ===" && find src-tauri/target -name "*.dmg" 2>/dev/null || echo "No DMG found in src-tauri/target" && echo "=== All bundle dirs ===" && find src-tauri/target -type d -name "bundle" 2>/dev/null || echo "No bundle dirs found" && echo "=== Target tree (first 30 lines) ===" && find src-tauri/target -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) 2>/dev/null | head -30 || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 3

  # =============================================
  # Windows (NSIS + MSI)
  # =============================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Windows)
        run: npm run tauri -- build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug bundle output
        shell: pwsh
        run: |
          echo "=== Checking bundle directory ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          echo "=== Checking exe/msi files ==="
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3

      - name: Upload MSI artifact (English)
        uses: actions/upload-artifact@v4
        with:
          name: installer-msi-en
          path: src-tauri/target/release/bundle/msi/en-US/*.msi
          retention-days: 3

      - name: Upload MSI artifact (Chinese)
        uses: actions/upload-artifact@v4
        with:
          name: installer-msi-zh
          path: src-tauri/target/release/bundle/msi/zh-CN/*.msi
          retention-days: 3

  # =============================================
  # 收集所有平台产物并创建 Release
  # =============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-macos-aarch64, build-macos-x86_64, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat <<'RELEASE_BODY' > /tmp/release_body.md
          ## Extractr $TAG

          ### 支持平台
          - **Windows 10/11** (x64) - 推荐
          - **macOS 13+** (Apple Silicon / Intel)

          ### 安装包

          #### Windows
          | 类型 | 文件 | 说明 |
          |------|------|------|
          | NSIS 安装包 | *.x64-setup.exe | 推荐，一键安装，自动注册文件关联和右键菜单 |
          | MSI 英文版 | *_en-US.msi | 企业部署 |
          | MSI 简体中文版 | *_zh-CN.msi | 企业部署 |

          #### macOS
          | 类型 | 文件 | 说明 |
          |------|------|------|
          | DMG (Apple Silicon) | *aarch64*.dmg | Apple Silicon Mac 推荐 |
          | DMG (Intel) | *x86_64*.dmg | Intel Mac |

          ### 支持的压缩格式
          **解压**: ZIP, RAR, 7z, TAR, GZIP, BZIP2, XZ, Zstandard 及所有 \`.tar.*\` 组合格式
          **创建**: ZIP, 7z, TAR, TAR.GZ, TAR.XZ（均支持密码保护）

          ### 系统要求
          - Windows 10/11 x64，无需管理员权限
          - macOS 13.0+，Apple Silicon 或 Intel

          ---

          *Built from commit \`${{ github.sha }}\`*
          RELEASE_BODY

          TAG="${{ needs.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "Extractr $TAG" \
            --draft \
            --notes-from /tmp/release_body.md

          # Upload all artifacts
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) | while read f; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber
          done

          echo ""
          echo "Draft release created: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "Edit the release to publish it."

  # =============================================
  # 发布 Draft Release（可选，需要确认后手动触发）
  # =============================================
  publish-release:
    name: Publish Draft Release
    runs-on: ubuntu-latest
    needs: create-release
    if: false  # 默认禁用，手动改为 true 或去掉此条件后触发
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag || github.event.inputs.version || github.ref_name }}
        run: |
          gh release view "$TAG" --repo ${{ github.repository }} || true
          gh release edit "$TAG" --draft=false --repo ${{ github.repository }}
          echo "Published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
