name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.5)"
        required: true

permissions:
  contents: write

jobs:
  # =============================================
  # 解析版本号（tag 推送或手动输入）
  # =============================================
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT

  # =============================================
  # 创建 Draft Release（幂等：已存在则更新）
  # 每个 build job 直接 gh release upload 产物到此处创建的 release，
  # 不再走 download-artifact 中转（v4 跨 job 产物在本仓库不稳定，曾导致 0 assets）。
  # =============================================
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Write release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat <<'RELEASE_BODY' > /tmp/release_body.md
          ## Extractr $TAG

          ### 支持平台
          - **Windows 10/11** (x64) - 推荐
          - **macOS 13+** (Apple Silicon / Intel)

          ### 安装包

          #### Windows
          | 类型 | 文件 | 说明 |
          |------|------|------|
          | NSIS 安装包 | *.x64-setup.exe | 推荐，一键安装，自动注册文件关联和右键菜单 |
          | MSI 英文版 | *_en-US.msi | 企业部署 |
          | MSI 简体中文版 | *_zh-CN.msi | 企业部署 |

          #### macOS
          | 类型 | 文件 | 说明 |
          |------|------|------|
          | DMG (Apple Silicon) | *aarch64*.dmg | Apple Silicon Mac 推荐 |
          | DMG (Intel) | *x86_64*.dmg | Intel Mac |

          ### 支持的压缩格式
          **解压**: ZIP, RAR, 7z, TAR, GZIP, BZIP2, XZ, Zstandard 及所有 `.tar.*` 组合格式
          **创建**: ZIP, 7z, TAR, TAR.GZ, TAR.XZ（均支持密码保护）

          ### 系统要求
          - Windows 10/11 x64，无需管理员权限
          - macOS 13.0+，Apple Silicon 或 Intel

          ---

          *Built from commit \`${{ github.sha }}\`*
          RELEASE_BODY

          # heredoc 引号定界 → $TAG 保持字面量；写完替换为实际版本号。
          sed -i "s/\$TAG/$TAG/g" /tmp/release_body.md

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # 幂等：已存在则更新 notes/title 并保持 draft；不存在则创建。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating..."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Extractr $TAG" \
              --notes-file /tmp/release_body.md \
              --draft
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Extractr $TAG" \
              --draft \
              --notes-file /tmp/release_body.md
          fi
          echo "Draft release ready: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

  # =============================================
  # macOS (Apple Silicon)
  # =============================================
  build-macos-aarch64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: [version, create-release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Apple Silicon)
        run: npm run tauri -- build --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug bundle output
        run: find src-tauri/target -name "*.dmg" 2>/dev/null || echo "No DMG found"

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" -type f | while read f; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

  # =============================================
  # macOS (Intel)
  # =============================================
  build-macos-x86_64:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: [version, create-release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable + x86_64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Intel)
        run: npm run tauri -- build --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug bundle output
        run: find src-tauri/target -name "*.dmg" 2>/dev/null || echo "No DMG found"

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" -type f | while read f; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

  # =============================================
  # Windows (NSIS + MSI)
  # =============================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [version, create-release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Windows)
        run: npm run tauri -- build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug bundle output
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload installers to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            Write-Host "Uploading: $($f.FullName)"
            gh release upload "$env:TAG" "$($f.FullName)" --clobber --repo "$env:GITHUB_REPOSITORY"
          }

  # =============================================
  # 发布 Release（所有 build 完成后取消 draft）
  # =============================================
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, create-release, build-macos-aarch64, build-macos-x86_64, build-windows]
    if: always() && needs.build-macos-aarch64.result == 'success' && needs.build-macos-x86_64.result == 'success' && needs.build-windows.result == 'success'
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "Assets on release $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
