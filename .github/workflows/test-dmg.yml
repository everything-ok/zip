name: Test DMG Version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v0.2.5)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # =============================================
  # 运行 Rust 核心测试（在 macOS 上验证跨平台逻辑）
  # =============================================
  test-core:
    name: Test archive-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Get release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo everything-ok/zip --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Test archive-core (all formats)
        run: cargo test --workspace --all-features -- --nocapture 2>&1 | head -200
        working-directory: crates/archive-core

      - name: Test with RAR support
        run: cargo test --workspace --features rar 2>&1 | head -100
        working-directory: crates/archive-core

  # =============================================
  # 下载并验证 DMG (Apple Silicon)
  # =============================================
  verify-dmg-arm64:
    name: Verify DMG (Apple Silicon)
    runs-on: macos-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Get release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo everything-ok/zip --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download DMG
        run: |
          curl -L -o Extractr_aarch64.dmg \
            "https://github.com/everything-ok/zip/releases/download/${{ steps.tag.outputs.tag }}/Extractr_${{ steps.tag.outputs.tag }}_aarch64.dmg" || \
          curl -L -o Extractr_aarch64.dmg \
            "https://github.com/everything-ok/zip/releases/download/${{ steps.tag.outputs.tag }}/Extractr_0.2.5_aarch64.dmg"
          ls -la Extractr_aarch64.dmg

      - name: Verify DMG integrity
        run: |
          file Extractr_aarch64.dmg
          hdiutil imageinfo Extractr_aarch64.dmg

      - name: Mount DMG
        run: |
          hdiutil attach Extractr_aarch64.dmg -mountpoint /Volumes/Extractr -nobrowse
          ls -la /Volumes/Extractr/

      - name: Verify app bundle
        run: |
          ls -la "/Volumes/Extractr/Extractr.app"
          codesign -dvv "/Volumes/Extractr/Extractr.app" 2>&1 || echo "Code signature check (may fail for unsigned)"

      - name: Cleanup
        run: hdiutil detach /Volumes/Extractr

  # =============================================
  # 下载并验证 DMG (Intel)
  # =============================================
  verify-dmg-x64:
    name: Verify DMG (Intel)
    runs-on: macos-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Get release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo everything-ok/zip --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download DMG
        run: |
          curl -L -o Extractr_x64.dmg \
            "https://github.com/everything-ok/zip/releases/download/${{ steps.tag.outputs.tag }}/Extractr_${{ steps.tag.outputs.tag }}_x64.dmg" || \
          curl -L -o Extractr_x64.dmg \
            "https://github.com/everything-ok/zip/releases/download/${{ steps.tag.outputs.tag }}/Extractr_0.2.5_x64.dmg"
          ls -la Extractr_x64.dmg

      - name: Verify DMG integrity
        run: |
          file Extractr_x64.dmg
          hdiutil imageinfo Extractr_x64.dmg

  # =============================================
  # 功能测试报告
  # =============================================
  report:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-core, verify-dmg-arm64, verify-dmg-x64]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## DMG Version Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| archive-core Tests | ${{ needs.test-core.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DMG (Apple Silicon) | ${{ needs.verify-dmg-arm64.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DMG (Intel) | ${{ needs.verify-dmg-x64.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All tests passed! DMG version is ready for release." >> $GITHUB_STEP_SUMMARY
