[workspace]
members = ["crates/archive-core", "crates/archive-cli", "src-tauri"]
default-members = ["crates/archive-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.8"
edition = "2021"
rust-version = "1.77"
authors = ["Extractr"]
license = "MIT"
repository = ""

[workspace.dependencies]
archive-core = { path = "crates/archive-core" }
# 解压相关（在 archive-core 里按需引用）
zip = { version = "8", default-features = false, features = ["deflate", "deflate64", "aes-crypto", "bzip2", "zstd", "time"] }
sevenz-rust2 = { version = "0.21", features = ["aes256", "util", "compress"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
xz2 = "0.1"
zstd = "0.13"
unrar = "0.5"
# 工具链
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
